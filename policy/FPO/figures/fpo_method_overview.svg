<svg width="1600" height="960" viewBox="0 0 1600 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="panelOffline" x1="60" y1="120" x2="760" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF5FF"/>
      <stop offset="1" stop-color="#F7FBFF"/>
    </linearGradient>
    <linearGradient id="panelOnline" x1="840" y1="120" x2="1540" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF5E7"/>
      <stop offset="1" stop-color="#FFFDF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9AA6B2" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6472"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A79C5"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D67B15"/>
    </marker>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #1F2937; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #5B6472; }
      .panelTitle { font-family: Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #1F2937; }
      .panelBody { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #526072; }
      .boxTitle { font-family: Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1F2937; }
      .boxText { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #485566; }
      .small { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #5F6B7A; }
      .formula { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #344152; }
      .tag { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: white; letter-spacing: 0.08em; }
      .arrowLabel { font-family: Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #526072; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="960" fill="url(#bg)"/>

  <text x="800" y="64" text-anchor="middle" class="title">Method Overview: Offline Flow Matching Pretraining + Online FPO Fine-Tuning</text>
  <text x="800" y="94" text-anchor="middle" class="subtitle">RoboTwin pipeline distilled from the current implementation in FlowMatching and the transplanted FPO training loop</text>

  <rect x="60" y="120" width="700" height="760" rx="28" fill="url(#panelOffline)" stroke="#B9D9F6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="840" y="120" width="700" height="760" rx="28" fill="url(#panelOnline)" stroke="#F2CE9A" stroke-width="2" filter="url(#shadow)"/>

  <rect x="90" y="150" width="128" height="28" rx="14" fill="#2A79C5"/>
  <text x="154" y="169" text-anchor="middle" class="tag">STAGE A</text>
  <text x="90" y="215" class="panelTitle">Offline Flow Matching pretraining</text>
  <text x="90" y="242" class="panelBody">Train a conditional flow model on demonstration sequences to obtain a pretrained policy checkpoint.</text>

  <rect x="870" y="150" width="128" height="28" rx="14" fill="#D67B15"/>
  <text x="934" y="169" text-anchor="middle" class="tag">STAGE B</text>
  <text x="870" y="215" class="panelTitle">Online FPO reinforcement learning fine-tuning</text>
  <text x="870" y="242" class="panelBody">Initialize from the pretrained checkpoint, collect on-policy rollouts, and optimize the actor with FPO plus a critic.</text>

  <rect x="110" y="300" width="230" height="132" rx="22" fill="#FFFFFF" stroke="#9DCAE9" stroke-width="2"/>
  <text x="135" y="338" class="boxTitle">Expert dataset</text>
  <text x="135" y="368" class="boxText">Demonstration trajectories</text>
  <text x="135" y="391" class="boxText">stored as `.zarr` replay data</text>
  <text x="135" y="414" class="small">images + low-dimensional state + actions</text>

  <rect x="110" y="496" width="230" height="140" rx="22" fill="#FFFFFF" stroke="#9DCAE9" stroke-width="2"/>
  <text x="135" y="534" class="boxTitle">Sequence construction</text>
  <text x="135" y="564" class="boxText">RobotImageDataset builds</text>
  <text x="135" y="587" class="boxText">stacked observation windows</text>
  <text x="135" y="610" class="boxText">and action horizons</text>
  <text x="135" y="633" class="small">normalizer + horizon padding + validation split</text>

  <rect x="390" y="300" width="320" height="336" rx="24" fill="#FFFFFF" stroke="#9DCAE9" stroke-width="2"/>
  <text x="420" y="338" class="boxTitle">Flow Matching pretraining</text>
  <text x="420" y="372" class="boxText">Observation encoder + Conditional UNet1D</text>
  <text x="420" y="395" class="boxText">learn a velocity field over action trajectories</text>

  <rect x="420" y="430" width="260" height="54" rx="16" fill="#E8F4FF" stroke="#B7D9F5"/>
  <text x="440" y="463" class="formula">1. Encode obs history  {head_cam, agent_pos}</text>

  <rect x="420" y="498" width="260" height="54" rx="16" fill="#E8F4FF" stroke="#B7D9F5"/>
  <text x="440" y="531" class="formula">2. Sample noise x0 and time t</text>

  <rect x="420" y="566" width="260" height="54" rx="16" fill="#E8F4FF" stroke="#B7D9F5"/>
  <text x="440" y="599" class="formula">3. Interpolate xt and predict velocity v(theta)</text>

  <text x="420" y="662" class="small">Objective: conditional flow matching loss on demonstration sequences</text>

  <rect x="430" y="706" width="240" height="110" rx="20" fill="#F3F4F6" stroke="#C9CDD3" stroke-width="2"/>
  <text x="455" y="744" class="boxTitle">Pretrained FM checkpoint</text>
  <text x="455" y="774" class="boxText">saved weights for the policy</text>
  <text x="455" y="797" class="small">used as the initialization of online FPO</text>

  <path d="M 225 432 L 225 496" stroke="#2A79C5" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M 340 365 C 365 365 370 365 390 365" stroke="#2A79C5" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M 340 566 C 365 566 370 566 390 566" stroke="#2A79C5" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M 550 636 L 550 706" stroke="#2A79C5" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="292" y="349" class="arrowLabel">demo sequences</text>
  <text x="285" y="553" class="arrowLabel">stacked samples</text>

  <rect x="900" y="290" width="290" height="170" rx="24" fill="#FFFFFF" stroke="#EDC186" stroke-width="2"/>
  <text x="930" y="328" class="boxTitle">FPO actor (policy)</text>
  <text x="930" y="358" class="boxText">FPOImagePolicy initialized from</text>
  <text x="930" y="381" class="boxText">the pretrained Flow Matching model</text>
  <text x="930" y="404" class="small">samples action sequences and auxiliary</text>
  <text x="930" y="425" class="small">FPO training signals: eps, t, initial CFM loss</text>

  <rect x="1280" y="286" width="210" height="178" rx="24" fill="#F0FAF2" stroke="#9DD4A8" stroke-width="2"/>
  <text x="1310" y="324" class="boxTitle">RoboTwin env(s)</text>
  <text x="1310" y="354" class="boxText">single env or vectorized</text>
  <text x="1310" y="377" class="boxText">FPORunner / VectorFPORunner</text>
  <text x="1310" y="400" class="small">execute first action only, then</text>
  <text x="1310" y="421" class="small">return next obs, reward, done, truncation</text>

  <rect x="900" y="530" width="250" height="130" rx="24" fill="#FFFFFF" stroke="#EDC186" stroke-width="2"/>
  <text x="930" y="568" class="boxTitle">Critic</text>
  <text x="930" y="598" class="boxText">MLP over encoded global condition</text>
  <text x="930" y="621" class="small">predicts state value for GAE and returns</text>

  <rect x="1220" y="530" width="270" height="140" rx="24" fill="#FFFFFF" stroke="#EDC186" stroke-width="2"/>
  <text x="1250" y="568" class="boxTitle">Rollout buffer + GAE</text>
  <text x="1250" y="598" class="boxText">store rewards, values, truncations,</text>
  <text x="1250" y="621" class="boxText">sampled action targets, eps, and t</text>
  <text x="1250" y="644" class="small">compute advantages and return targets</text>

  <rect x="880" y="718" width="390" height="120" rx="24" fill="#FFFFFF" stroke="#EDC186" stroke-width="2"/>
  <text x="910" y="756" class="boxTitle">FPO update</text>
  <text x="910" y="787" class="formula">recompute current CFM loss with fixed (eps, t)</text>
  <text x="910" y="810" class="formula">rho = exp( initial_loss - current_loss )</text>
  <text x="910" y="833" class="small">clipped surrogate for actor + MSE value loss for critic</text>

  <rect x="1310" y="728" width="170" height="100" rx="20" fill="#F3F4F6" stroke="#C9CDD3" stroke-width="2"/>
  <text x="1336" y="766" class="boxTitle">Updated model</text>
  <text x="1336" y="794" class="small">checkpoint + continue</text>
  <text x="1336" y="814" class="small">online fine-tuning loop</text>

  <path d="M 670 761 C 760 761 790 761 870 761" stroke="#7D8793" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>

  <path d="M 1190 375 C 1230 375 1240 375 1280 375" stroke="#D67B15" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="1238" y="356" text-anchor="middle" class="arrowLabel">execute first action</text>

  <path d="M 1280 420 C 1215 458 1175 470 1108 470" stroke="#5B6472" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1208" y="488" text-anchor="middle" class="arrowLabel">next obs history</text>

  <path d="M 1045 460 L 1045 530" stroke="#D67B15" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="1065" y="503" class="arrowLabel">global cond</text>

  <path d="M 1385 464 L 1385 530" stroke="#D67B15" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="1408" y="505" class="arrowLabel">reward, done</text>

  <path d="M 1150 595 C 1170 595 1180 595 1220 595" stroke="#D67B15" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="1188" y="575" text-anchor="middle" class="arrowLabel">values</text>

  <path d="M 1220 778 C 1260 778 1280 778 1310 778" stroke="#D67B15" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="1265" y="758" text-anchor="middle" class="arrowLabel">updated weights</text>

  <path d="M 1040 718 L 1040 660" stroke="#D67B15" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M 1385 728 C 1385 694 1385 686 1385 670" stroke="#D67B15" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="1128" y="693" class="arrowLabel">policy optimization</text>

  <path d="M 1310 808 C 1260 854 1080 854 980 836 C 925 826 912 800 920 760" stroke="#5B6472" stroke-width="3.5" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="1125" y="872" text-anchor="middle" class="small">repeat online rollout / FPO update loop until convergence</text>
</svg>
