name: PickCube-v1

shape_meta: &shape_meta
  obs:
    point_cloud:
      shape: [512, 3]
      type: point_cloud
    agent_pos:
      shape: [9]
      type: low_dim
  action:
    shape: [8]

dataset:
  _target_: diffusion_policy.dataset.robot_pointcloud_dataset.RobotPointCloudDataset
  zarr_path: data/PickCube-v1-smoke_npz-1.zarr
  batch_size: ${dataloader.batch_size}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.0
  max_train_episodes: null
