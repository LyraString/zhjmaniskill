defaults:
  - maniskill_fpo_base
  - task: maniskill_pickcube_task
  - _self_

name: maniskill_fpo_finetune
exp_name: "maniskill_finetune"
training:
  resume: True
  timesteps_per_batch: 16
  max_timesteps_per_episode: 20
  num_envs: 1
  online_only_no_dataset: False

dataloader:
  batch_size: 4

val_dataloader:
  batch_size: 4

logging:
  tags: ["${name}", "${task_name}", "${exp_name}", "FPO", "maniskill", "finetune"]
